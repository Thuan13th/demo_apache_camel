# =========================================================================
# PROFILE: PROD (Môi trường sản xuất - Tuân thủ bảo mật cấp ngân hàng / telco)
# =========================================================================

server:
  port: ${PORT:8080}

logging:
  level:
    root: WARN
    org.apache.camel: WARN
    com.demo_apache_camel: INFO

# Trên Production, BẮT BUỘC inject từ Kubernetes Secret / Vault
hub:
  environment: prod
  storage:
    inbound-path: ${HUB_INBOUND_PATH:/mnt/hub_storage/inbound}
    processed-path: ${HUB_PROCESSED_PATH:/mnt/hub_storage/processed}
    samples-path: ${HUB_SAMPLES_PATH:/mnt/hub_storage/samples}
  partner-policy:
    max-retry-attempts: 3
    retry-delay-ms: 2000
    parallel-timeout-ms: 2500

security:
  telecom-checksum-secret: ${TELECOM_CHECKSUM_SECRET}
  enable-checksum-validation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
